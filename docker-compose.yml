  db:
    image: postgres:16-alpine
    container_name: go-db
    restart: unless-stopped
    ports:
    - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: go-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal

  emailpit:
    image: axllent/mailpit:latest
    container_name: go-emailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
